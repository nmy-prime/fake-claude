spring.application.name= fake-claude
logging.threshold.console= ERROR

spring.ai.deepseek.api-key= ${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.options.model= deepseek-flash
spring.ai.deepseek.chat.options.temperature= 0.7

logging.level.org.springframework.ai.chat.client.advisor= DEBUG

# shell 工具（ToolService）：仅允许预定义的只读命令，任意命令需由用户自行在终端执行
fake-claude.shell.work-dir= ${user.dir}
fake-claude.shell.timeout-seconds= 60
# Windows 控制台默认 GBK，乱码就改这里（如 UTF-8）
fake-claude.shell.charset= GBK

# 文件工具：只允许往这个目录里写
fake-claude.fs.base-dir= ${user.dir}

spring.ai.mcp.client.stdio.services-configuration=classpath: /mcp/mcp-servers-config.json
